# Every push and pull request on main/develop: types, then the full static build
# (prerendering every page catches broken links, missing data and server errors).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run generate
        env:
          NUXT_PUBLIC_SITE_URL: https://maxime-leclerc.com
